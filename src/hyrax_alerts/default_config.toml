[data_request.infer_stream.data]
dataset_class = "hyrax_alerts.consumers.kafka_consumer.HyraxKafkaConsumer"
data_location = "kafka://localhost:9092/my-topic"
primary_id_field = "id"
fields = ["image", "label"]

[hyrax_alerts]
# Where records dropped by pre_filter/post_filter are written.
#   true    -> alongside the alerts that were kept, in this run's output directory:
#              <general.results_dir>/<timestamp>-hyrax_alerts-<rand>/rejected/<member>/
#   false   -> don't persist removed records (they are still counted in the logs)
#   a path  -> <path>/<timestamp>-hyrax_alerts-<rand>/<member>/
# <member> is "consumer" for pre_filter drops, or a writer's config name for
# post_filter drops. Individual writers can override this with their own
# [hyrax_alerts.writers.<name>.reject_writer] table.
reject_output_root = true

[hyrax_alerts.consumer]
pre_process = "hyrax_alerts.example_functions.example_pre_process"
pre_filter = "hyrax_alerts.example_functions.example_pre_filter"
# if alert limit is greater than or equal to 0, then process_alerts
# will run until it hits the provided limit. useful for debugging,
# especially on high volume streams.
alert_limit = false

[hyrax_alerts.consumer.BabamulConsumer]
# whether to keep alerts as the raw dict or instantiate them as
# lsst/ztf babamul objects.
raw_alert = false