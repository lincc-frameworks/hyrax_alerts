[data_request.infer_stream.data]
dataset_class = "hyrax_alerts.consumers.kafka_consumer.HyraxKafkaConsumer"
data_location = "kafka://localhost:9092/my-topic"
primary_id_field = "id"
fields = ["image", "label"]

[hyrax_alerts]
# If/where records dropped by pre_filter/post_filter are written.
#   true    -> alongside the alerts that were kept, in this run's output directory:
#              <general.results_dir>/<timestamp>-hyrax_alerts-<rand>/rejected/<member>/
#   false   -> don't persist removed records (they are still counted in the logs)
#   a path  -> <path>/<timestamp>-hyrax_alerts-<rand>/<member>/
# <member> is "consumer" for pre_filter drops, or a writer's config name for
# post_filter drops. Individual writers can override this with their own
# [hyrax_alerts.writers.<name>.reject_writer] table.
reject_output_root = true

[hyrax_alerts.consumer]
pre_process = "hyrax_alerts.example_functions.example_pre_process"
pre_filter = "hyrax_alerts.example_functions.example_pre_filter"
# if alert limit is greater than or equal to 0, then process_alerts
# will run until it hits the provided limit. useful for debugging,
# especially on high volume streams.
alert_limit = false

[hyrax_alerts.consumer.BabamulConsumer]
# whether to keep alerts as the raw dict or instantiate them as
# lsst/ztf babamul objects.
raw_alert = false

[hyrax_alerts.consumer.BabamulPhotometryConsumer]
# path to the precomputerd feature statistics (used for training)
stats_path = "./feature_stats_day100.npz"

[hyrax_alerts.consumer.FinkConsumer]
# Fink carries the Avro writer schema as JSON in the Kafka message key, so no schema
# file is normally needed. Older Fink streams put a bare version string there instead;
# point this at a matching .avsc to decode those. false means "no fallback".
schema_path = false

[hyrax_alerts.consumer.AlerceConsumer]
# Field carrying the alert's primary identifier. "candid" for ALeRCE's ZTF-era topics.
id_field = "candid"

# Note on ALeRCE topics: they are date-suffixed and rotate nightly
# (lc_classifier_20260820), retained for 48 hours. Rather than editing the config each
# night, give [data_set.KafkaStreamDataset].topics a regex -- librdkafka treats a leading
# "^" as a pattern and picks up new matching topics on its own:
#   topics = ["^lc_classifier_[0-9]{8}"]
#
# Note on broker credentials for both Fink and ALeRCE: SASL settings belong in the
# [data_set.KafkaStreamDataset].credentials_file TOML (Fink uses SCRAM-SHA-512, ALeRCE
# uses SCRAM-SHA-256), never in consumer_options, which is not meant to hold secrets.
