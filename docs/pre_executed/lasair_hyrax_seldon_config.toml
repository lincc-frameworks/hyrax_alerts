#############################
# Hyrax-alerts configurations
#############################
[hyrax_alerts.consumer]
pre_process = "hyrax_alerts.lasair_preprocess.lasair_pre_process"
pre_filter = "hyrax_alerts.example_functions.example_pre_filter"
alert_limit = 500

# With no output_location, this writer writes to ./results/<run_dir>/to_disk_0/.
# Set output_location to send it somewhere else; it then gets its own
# <timestamp>-hyrax_alerts-<rand> subdirectory inside that location.
[hyrax_alerts.writers.to_disk_0]
writer_class = "HyraxAlertsDiskWriter"
post_process = "hyrax_alerts.example_functions.example_post_process"
post_filter = "hyrax_alerts.example_functions.example_post_filter"



############################################
# Alerts specific to the Hyrax configuration
############################################
[data_request.infer_stream.data]
dataset_class = "hyrax_alerts.consumers.lasair_lite_lc_consumer.LasairLiteConsumer"
data_location = "kafka://lasair-lsst-kafka.lsst.ac.uk:9092/lasair_201DrewsLSSTvariables/group_1"
primary_id_field = "diaObjectId"
fields = ["ra", "decl", "psfFlux", "psfFluxErr", "midpointMjdTai", "band"]

[model]
name = "hyrax_seldon.models.seldon.HyraxSeldon"

[model.HyraxSeldon]
seldon_config = "./hparams.yaml"
band_field_name = "band"
mjd_field_name = "midpointMjdTai"
flux_field_name = "psfFlux"
flux_err_field_name = "psfFluxErr"
phot_flag_field_name = "photFlag"

[infer_stream]
model_weights_file = "./epoch=1086-val_loss=1.18.ckpt"
save_model_output = true
